name: Daily OC Fetch — Mercado Público

on:
  schedule:
    # Chile verano = UTC-3. Horarios locales → UTC:
    - cron: '0 12 * * *'   # 09:00 Chile
    - cron: '0 14 * * *'   # 11:00 Chile
    - cron: '0 16 * * *'   # 13:00 Chile (1 PM)
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha en formato DDMMAAAA (default: hoy)'
        required: false
        default: ''

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # needed to commit the CSV back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch órdenes de compra (incremental)
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_ALERTAS: ${{ secrets.EMAIL_ALERTAS }}
        run: |
          FECHA_ARG=""

          # If triggered manually with a date input, use it
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            FECHA_ARG="--fecha ${{ github.event.inputs.fecha }}"
          fi

          python fetch_ordenes_compra.py $FECHA_ARG

      - name: Commit and push updated CSVs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Inject token into remote URL so push can authenticate
          git remote set-url origin \
            https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          # Only add data/ if it exists (no orders = no directory)
          if [ -d data ]; then
            git add data/
          fi
          # Only commit and push if there are staged changes
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "chore: OC Mercado Público $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ github.ref_name }}
          fi
