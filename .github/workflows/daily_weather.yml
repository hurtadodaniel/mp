name: Daily OC Fetch — Mercado Público

on:
  schedule:
    # Chile verano = UTC-3. Horarios locales → UTC:
    - cron: '0 12 * * *'   # 09:00 Chile
    - cron: '0 14 * * *'   # 11:00 Chile
    - cron: '0 16 * * *'   # 13:00 Chile (1 PM)
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha en formato DDMMAAAA (default: hoy)'
        required: false
        default: ''
      estado:
        description: 'Estado de la OC (todos, aceptada, enviadaproveedor, ...)'
        required: false
        default: 'todos'

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit the CSV back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch órdenes de compra
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: |
          FECHA_ARG=""
          ESTADO_ARG="todos"

          # If triggered manually with inputs, use them
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            FECHA_ARG="--fecha ${{ github.event.inputs.fecha }}"
          fi
          if [ -n "${{ github.event.inputs.estado }}" ]; then
            ESTADO_ARG="${{ github.event.inputs.estado }}"
          fi

          python fetch_ordenes_compra.py $FECHA_ARG --estado $ESTADO_ARG

      - name: Commit and push updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: OC Mercado Público $(date +'%Y-%m-%d')"
          git push
